<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartelera de Eventos - XalaPaseando</title>
    <link rel="icon" type="image/png" href="Icons/Icono.png">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
</head>
<script src="navegacion.js"></script>
<body class="tema-claro">

    
    <nav class="navbar">
        <div class="logo">
            <span class="logo-text"><span class="logo-x">X</span>ala<span class="logo-paseando">Paseando</span></span>
            <img src="Icons/Icono_Ubi.png" alt="Logotipo" class="logo-img">
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Inicio</a></li>
            <li><a href="explora.html">Explora</a></li>
            <li><a href="eventos.html" class="active">Eventos</a></li>
            <li><a href="comunidad.html">Comunidad</a></li>
        </ul>
        <div class="nav-icons">
           <img src="Icons/Icono_Lupa.png" alt="Buscar" class="icon-img">
            <span class="icon" style="color: white;">☰</span>
        </div>
    </nav>

    <main class="contenedor-explora">
        <div class="encabezado-seccion">
            <h2 class="titulo-azul">Próximos Eventos en Xalapa</h2>
            <p class="subtitulo">Descubre todo lo que la ciudad tiene para ti esta temporada.</p>
        </div>

        
<section class="grid-tarjetas" id="lista-eventos">
    
</section>

    </main>
    
<script src="datos-eventos.js"></script>

<script>document.addEventListener("DOMContentLoaded", () => {

    const contenedor = document.getElementById("lista-eventos");

    contenedor.innerHTML = "";

    eventosXalapa.forEach(evento => {

        const tarjeta = document.createElement("a");
        tarjeta.href = "evento-detalle.html?id=" +
            encodeURIComponent(evento.id);

        tarjeta.className = "enlace-tarjeta-evento";

        tarjeta.innerHTML = `
            <article class="tarjeta tarjeta-evento">
                <div class="imagen-evento">
                    <img src="${evento.imagen}"
                         alt="Cartel de ${evento.nombre}"
                         loading="lazy">

                    <div class="fecha-badge">
                        <strong>${evento.dia}</strong>
                        <span>${evento.mes}</span>
                    </div>

                    <span class="precio-evento">
                        ${evento.precio}
                    </span>
                </div>

                <div class="tarjeta-cuerpo">
                    <span class="etiqueta roja">
                        ${evento.etiquetas?.includes("Halloween") ? "Halloween · " : ""}${evento.categoria}
                    </span>

                    <h3>${evento.nombre}</h3>

                    <p>${evento.descripcion}</p>

                    <div class="tarjeta-pie mt-10">
                        <span>📍 ${evento.lugar}</span>
                        <span>${evento.hora} hrs</span>
                    </div>
                </div>
            </article>
        `;

        contenedor.appendChild(tarjeta);
    });
});
</script>

</body>
</html>
